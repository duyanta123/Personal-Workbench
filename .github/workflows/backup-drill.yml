name: Monthly backup drill

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install PostgreSQL client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client
      - run: npm run backup:drill
        env:
          BACKUP_DRILL_ADMIN_DATABASE_URL: ${{ secrets.BACKUP_DRILL_ADMIN_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.BACKUP_DRILL_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.BACKUP_DRILL_S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_DRILL_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_DRILL_S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.BACKUP_DRILL_S3_REGION }}
          S3_PREFIX: personal-workbench
          REQUIRE_PRODUCTION_BACKUP: 'true'
          REQUIRE_S3_LIFECYCLE: 'true'
