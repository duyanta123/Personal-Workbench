name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ci
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          VITE_APP_RELEASE: ${{ github.sha }}
      - run: npm run test:e2e
      - run: npm run test:pwa
      - run: npm audit --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # 集成测试需要完整本地 API（auth/rest/kong），db start 只启动 Postgres，
      # 会导致 status -o env 只导出 DB_URL 而缺少密钥，因此启动完整栈。
      - run: supabase start
      - name: Export local Supabase API credentials
        # status -o env 输出 KEY="value"，GITHUB_ENV 不做 shell 展开，需先去掉引号。
        run: supabase status -o env | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: Apply core migrations
        run: supabase db reset
      - name: Lint core database
        run: supabase db lint --local --level warning
      - name: Run core pgTAP tests
        run: supabase test db
      - name: Fail on database type drift
        run: |
          git ls-files --error-unmatch supabase/generated/database.types.ts >/dev/null
          supabase gen types typescript --local --schema public > supabase/generated/database.types.ts
          git diff --exit-code -- supabase/generated/database.types.ts
      - name: Validate deferred rollout migrations and tests
        # 锁定迁移会撤销核心表的直接写权限，核心套件在 rollout PR 中随迁移一起改写；
        # 这里仅验证延期迁移可干净应用且延期测试自身通过，因此先移出核心测试。
        run: |
          cp supabase/deferred_migrations/*.sql supabase/migrations/
          mkdir -p /tmp/core-tests
          mv supabase/tests/database/*.sql /tmp/core-tests/
          cp supabase/deferred_tests/*.sql supabase/tests/database/
          supabase db reset
          supabase db lint --local --level warning
          supabase test db
      - name: Exercise real auth, RLS, recent auth and restore health RPCs
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-types
          path: supabase/generated/database.types.ts
